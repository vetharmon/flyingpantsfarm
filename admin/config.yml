backend:
  name: git-gateway
  repo: vetharmon/flyingpantsfarm
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "posts"
    label: "Current Events"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Welcome Page"
        name: "home"
        file: "index.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "About Us"
        name: "about"
        file: "about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Farm Stand"
        name: "farm_stand"
        file: "farm-stand.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Sales"
        name: "sales"
        file: "sales.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "tubers"
    label: "Dahlia Tubers"
    folder: "_tubers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Variety Name", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Price", name: "price", widget: "number", value_type: "float" }
      - { label: "Quantity Available", name: "quantity", widget: "number", default: 0, value_type: "int" }
      - { label: "Description", name: "description", widget: "text", required: false }
