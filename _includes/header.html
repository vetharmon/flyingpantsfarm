<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-mark">✿</span>
    <span>Flying Pants Flower Farm</span>
  </a>

  <nav class="site-nav" aria-label="Main navigation">
    {% for item in site.data.navigation %}
      <a href="{{ item.url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.name }}</a>
    {% endfor %}
  </nav>
</header>
